<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HedgeFundHR - Atomic Hiring Intelligence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Matrix Rain Background -->
    <canvas id="matrix"></canvas>

    <!-- Main Container -->
    <main class="glass-container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="glitch-container">
                <h1 class="glitch" data-text="CRISIS-PROOF HIRING">CRISIS-PROOF HIRING</h1>
                <p class="subtitle">AI-trained on 15 years of market collapses</p>
            </div>
            
            <!-- Live Demo Box -->
            <div class="demo-box">
                <input 
                    type="text" 
                    id="jobInput" 
                    placeholder='"Portfolio Manager" "Risk Analyst"'
                    class="terminal-input"
                >
                <button onclick="initiateAtomicScan()" class="cta-pulse">
                    LAUNCH CANDIDATE SCAN → 
                </button>
                <div id="resultsContainer"></div>
            </div>
        </section>

        <!-- Crisis Timeline -->
        <section class="timeline">
            <div class="timeline-event" data-year="2008">
                <h3>Lehman Brothers Collapse</h3>
                <p>Survivors average +47% returns (2009-2012)</p>
            </div>
            <div class="timeline-event" data-year="2020">
                <h3>COVID Market Crash</h3>
                <p>Top candidates identified March 23 bottom</p>
            </div>
            <div class="timeline-event" data-year="2023">
                <h3>Banking Crisis</h3>
                <p>SVB/RBC survivors now in demand</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
