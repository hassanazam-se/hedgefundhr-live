<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HedgeFundHR | Crisis Talent Intelligence Platform</title>
    <style>
        :root {
            --navy: #0A1A2F;
            --gold: #FFD700;
            --red: #DC143C;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--navy);
            color: white;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 4rem;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-card img {
            width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div>
            <h1>Crash-Tested Talent Acquisition</h1>
            <button>Request Free Audit</button>
        </div>
        <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop" 
             alt="Financial Chart"
             style="border-radius:12px">
    </section>

    <!-- Features -->
    <section style="padding:4rem; max-width:1200px; margin:0 auto">
        <div class="feature-card">
            <h2>Survivor Analytics</h2>
            <img src="https://via.placeholder.com/600x400.png?text=Crisis+Performance+Dashboard+📉&color=1a365d" 
                 alt="Analytics Preview">
        </div>

        <div class="feature-card">
            <h2>Compliance Checks</h2>
            <img src="https://via.placeholder.com/600x400.png?text=SEC+Regulation+Shield+🛡️&color=2d3748" 
                 alt="Compliance Interface">
        </div>
    </section>

    <!-- Client Logos -->
    <div style="display:flex; gap:2rem; justify-content:center; padding:2rem">
        <img src="https://via.placeholder.com/150x50.png?text=Goldman+Sachs&color=ffffff20" 
             alt="Client 1">
        <img src="https://via.placeholder.com/150x50.png?text=Blackstone&color=ffffff20" 
             alt="Client 2">
        <img src="https://via.placeholder.com/150x50.png?text=Citadel&color=ffffff20" 
             alt="Client 3">
    </div>
</body>
</html>
