<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HedgeFundHR - Crisis Talent Acquisition</title>
    <style>
        :root {
            --navy: #0a1a2f;
            --gold: #ffd700;
            --red: #dc143c;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--navy);
            color: white;
        }

        .hero {
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
        }

        .feature-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .client-logos img {
            height: 40px;
            margin: 0 2rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <!-- Hero Section with Trading Floor Image -->
    <section class="hero">
        <h1>Crisis-Proven Financial Talent</h1>
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/NYSE_Floor.jpg" 
             alt="Trading Floor"
             style="width:100%; max-width:800px; margin:2rem auto; border-radius:8px">
        <p>AI-powered identification of market crash survivors</p>
        <button style="background:var(--red); padding:1rem 2rem; border:none; color:white; margin:1rem">
            Request Demo
        </button>
    </section>

    <!-- Features Section -->
    <section style="padding:4rem 2rem; max-width:1200px; margin:0 auto">
        <div style="display:grid; gap:2rem; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr))">
            <div class="feature-card">
                <h3>Crunch Analytics</h3>
                <img src="https://images.unsplash.com/photo-1454165804606-3bfedd6ebbac" 
                     alt="Analytics Dashboard">
            </div>
            
            <div class="feature-card">
                <h3>Regulation Shield</h3>
                <img src="https://images.unsplash.com/photo-1584433144859-1fc3ab64a957" 
                     alt="Security Protocols">
            </div>
        </div>
    </section>

    <!-- Client Logos -->
    <div style="text-align:center; padding:3rem 0; background:#00000020">
        <div class="client-logos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Black_rectangle.svg?style=blur&width=150&height=50&color=ffffff20" 
                 alt="Client 1">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Black_rectangle.svg?style=blur&width=150&height=50&color=ffffff20" 
                 alt="Client 2">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Black_rectangle.svg?style=blur&width=150&height=50&color=ffffff20" 
                 alt="Client 3">
        </div>
    </div>
</body>
</html>
