<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HedgeFundHR | Crisis Recruitment Platform</title>
    <style>
        :root {
            --navy: #0a1a2f;
            --gold: #ffd700;
            --red: #dc143c;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: var(--navy);
            color: white;
        }

        .hero {
            padding: 4rem 2rem;
            text-align: center;
        }

        .hero img {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            margin: 2rem auto;
            display: block;
        }

        .features {
            display: grid;
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .feature-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            filter: brightness(0.9);
        }

        .clients {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            padding: 3rem 2rem;
        }

        .clients img {
            height: 40px;
            opacity: 0.8;
            filter: grayscale(1);
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <h1>Crisis-Proof Your Team</h1>
        <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1600&q=80" 
             alt="Financial Chart Analysis">
        <button style="background:var(--red); padding:1rem 2rem; border:none; color:white; cursor:pointer">
            Find Resilient Talent →
        </button>
    </section>

    <!-- Features -->
    <section class="features">
        <div class="feature-card">
            <img src="https://images.unsplash.com/photo-1454165804606-3bfedd6ebbac?auto=format&fit=crop&w=800&q=80" 
                 alt="Analytics Dashboard">
            <h3>Market Collapse Simulation</h3>
            <p>Stress-test candidates under crisis scenarios</p>
        </div>

        <div class="feature-card">
            <img src="https://images.unsplash.com/photo-1584433144859-1fc3ab64a957?auto=format&fit=crop&w=800&q=80" 
                 alt="Security Protocols">
            <h3>Regulatory Compliance</h3>
            <p>Automated FINRA/SEC checks</p>
        </div>
    </section>

    <!-- Client Logos -->
    <div class="clients">
        <img src="https://via.placeholder.com/150x50/ffffff20/ffffff80?text=Goldman+Sachs" 
             alt="Client 1">
        <img src="https://via.placeholder.com/150x50/ffffff20/ffffff80?text=Blackstone" 
             alt="Client 2">
        <img src="https://via.placeholder.com/150x50/ffffff20/ffffff80?text=Citadel" 
             alt="Client 3">
    </div>
</body>
</html>
